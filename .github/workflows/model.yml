name: Host Taylor's native brain (Gemma 3 1B)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/model.yml']
permissions:
  contents: write
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - name: Download the model (unmodified LiteRT build of Google's Gemma 3 1B IT)
        run: |
          curl -fL --retry 3 -o gemma3-1b-it-int4.task "https://huggingface.co/rajeevkr23/secure-notes-ai-gemma3-1b/resolve/main/gemma3-1b-it-int4.task"
          ls -l gemma3-1b-it-int4.task
          sha256sum gemma3-1b-it-int4.task | tee SHA256.txt
          # compare with Google's original listing if it is readable without login
          curl -fsL "https://huggingface.co/api/models/litert-community/Gemma3-1B-IT/tree/main" -o official.json && grep -o '"path":"gemma3-1b-it-int4.task"[^}]*' official.json || echo "official listing not readable (gated): size check only"
          S=$(stat -c %s gemma3-1b-it-int4.task); test "$S" -gt 500000000 && test "$S" -lt 600000000
      - name: Gemma terms notice
        run: |
          cat > GEMMA_NOTICE.txt <<'TXT'
          Gemma is provided under and subject to the Gemma Terms of Use found at ai.google.dev/gemma/terms
          This file is an unmodified copy of gemma3-1b-it-int4.task (litert-community/Gemma3-1B-IT, a LiteRT build of google/gemma-3-1b-it).
          Use is subject to the Gemma Prohibited Use Policy: ai.google.dev/gemma/prohibited_use_policy
          TXT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: models
          name: Taylor's native brain (models)
          prerelease: true
          files: |
            gemma3-1b-it-int4.task
            GEMMA_NOTICE.txt
            SHA256.txt
          body: Model files downloaded by the Wildlens Android app. Gemma is provided under and subject to the Gemma Terms of Use (ai.google.dev/gemma/terms).
