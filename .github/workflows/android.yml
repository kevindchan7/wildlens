name: Build Android app
on:
  push:
    branches: [main]
    paths: ['app/**', 'mobile/**', 'gestionale/**', 'scripts/**', 'index.html', 'condizioni.html', 'poster.html', 'icon.svg', 'sw.js', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/local-notifications@latest @capacitor/haptics@latest @capacitor/splash-screen@latest @capacitor/camera@latest
      - name: Install optional sensor plugins (skipped if unavailable)
        run: |
          for p in @capawesome/capacitor-torch @capgo/capacitor-flash @capacitor-community/text-to-speech @capacitor-community/speech-recognition; do npm install "$p@latest" || echo "skip $p"; done
      - name: Copy web app
        run: npm run copy-web
      - name: Protect code inside the app
        run: npm install --no-save terser@5 && cp ../scripts/proteggi.mjs ./proteggi.mjs && node proteggi.mjs www && rm proteggi.mjs
      - name: Add Android platform
        run: npx cap add android
      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for perm in RECORD_AUDIO ACTIVITY_RECOGNITION ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION CAMERA FLASHLIGHT VIBRATE POST_NOTIFICATIONS WAKE_LOCK SCHEDULE_EXACT_ALARM FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION; do
            grep -q "android.permission.$perm" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$perm\" />\n</manifest>#" $M
          done
          grep -q 'android.hardware.location.gps' $M || sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
      - name: Native sensors (barometer, step counter)
        run: |
          D=android/app/src/main/java/app/wildlens/field
          mkdir -p $D && cp native-android/*.java $D/
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'RecognitionService' $M || sed -i 's#<application#<queries>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>\n    </queries>\n    <application#' $M
          grep -q 'application/gpx' $M || python3 - "$M" <<'PY'
          import sys
          p=sys.argv[1];t=open(p).read()
          f=''.join('<intent-filter><action android:name="android.intent.action.%s" /><category android:name="android.intent.category.DEFAULT" />%s<data android:mimeType="%s" /></intent-filter>\n            '%(a,'<category android:name="android.intent.category.BROWSABLE" />' if a=='VIEW' else '',m) for a in ('VIEW','SEND') for m in ('application/gpx+xml','application/gpx','application/octet-stream','text/xml','application/xml'))
          i=t.index('</activity>');t=t[:i]+f+t[i:];open(p,'w').write(t)
          PY
          grep -q 'TrackService' $M || sed -i 's#</application>#    <service android:name="app.wildlens.field.TrackService" android:exported="false" android:foregroundServiceType="location" />\n    </application>#' $M
          grep -q 'sensor.barometer' $M || sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.sensor.barometer" android:required="false" />\n    <uses-feature android:name="android.hardware.sensor.stepcounter" android:required="false" />\n</manifest>#' $M
      - name: Native AI brain (MediaPipe LLM Inference)
        run: |
          G=android/app/build.gradle
          grep -q 'tasks-genai' $G || sed -i "0,/^dependencies {/s//dependencies {\n    implementation 'com.google.mediapipe:tasks-genai:0.10.27'/" $G
          grep -q 'tasks-vision' $G || sed -i "0,/^dependencies {/s//dependencies {\n    implementation 'com.google.mediapipe:tasks-vision:0.10.26'/" $G
          grep -q 'abiFilters' $G || sed -i "0,/defaultConfig {/s//defaultConfig {\n        ndk { abiFilters 'arm64-v8a' }/" $G
          grep -q 'noCompress' $G || sed -i "0,/^android {/s//android {\n    androidResources { noCompress += ['tflite', 'task'] }/" $G
      - name: Photo recognition models bundled in the app
        run: |
          A=android/app/src/main/assets/models && mkdir -p $A
          get(){ curl -fsSL --retry 2 -o "$A/$1.tflite" "$2" && python3 -c "import sys;d=open('$A/$1.tflite','rb').read(8);sys.exit(0 if d[4:8]==b'TFL3' else 1)" && echo "OK $1 $(stat -c %s $A/$1.tflite)" || { echo "SKIP $1"; rm -f "$A/$1.tflite"; }; }
          get general "https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite2/float32/latest/efficientnet_lite2.tflite"
          get plants "https://tfhub.dev/google/lite-model/aiy/vision/classifier/plants_V1/3?lite-format=tflite"
          get birds "https://tfhub.dev/google/lite-model/aiy/vision/classifier/birds_V1/3?lite-format=tflite"
          get insects "https://tfhub.dev/google/lite-model/aiy/vision/classifier/insects_V1/3?lite-format=tflite"
          ls -l $A
          grep -n "tasks-genai\|minSdk" $G android/variables.gradle || true
      - name: Icons and splash
        run: npm install @capacitor/assets --save-dev && npx capacitor-assets generate --android --iconBackgroundColor '#2d5a34' --splashBackgroundColor '#f3e3c9' || echo "assets skipped"
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../Wildlens.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wildlens-android
          path: Wildlens.apk
      - name: Publish to the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Wildlens for Android (latest build)
          prerelease: true
          files: Wildlens.apk
          body: Test build of Wildlens for Android. Download Wildlens.apk on your phone and open it (allow installing from your browser).
      - name: Publish website, web app, Gestionale and APK (branch "pubblico", served by Render)
        working-directory: .
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r index.html sw.js icon.svg condizioni.html poster.html app gestionale /tmp/site/
          S=$(stat -c %s Wildlens.apk); if [ $S -lt 95000000 ]; then cp Wildlens.apk /tmp/site/Wildlens.apk; else echo "APK $S bytes: served from the GitHub release only"; fi
          npm install --silent --no-save --prefix /tmp/prot terser@5 && cp scripts/proteggi.mjs /tmp/prot/ && node /tmp/prot/proteggi.mjs /tmp/site
          cd /tmp/site
          git init -q -b pubblico
          git config user.name "wildlens-bot"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "Sito pubblico ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pubblico
