<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wildlens · Poster QR</title>
<link rel="icon" href="icon.svg">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2a22}
.tools{max-width:210mm;margin:16px auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 8px}
.tools select,.tools input,.tools button{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid #bbb;background:#fff}.tools button{background:#2d5a34;color:#fff;border:0;font-weight:700}
.sheet{width:210mm;height:297mm;margin:0 auto 24px;background:#f4ecdc;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:22mm 18mm}
.sheet svg.mnt{position:absolute;left:0;right:0;bottom:0;width:100%;height:80mm}
.brand{display:flex;align-items:center;gap:12px;font:600 40px Georgia,serif}.brand img{width:64px;height:64px;border-radius:16px}
h1{font:700 46px/1.1 Georgia,serif;margin:16mm 0 6mm}p.lead{font-size:20px;max-width:150mm;margin:0;color:#4a5a4e}
.qr{background:#fff;border-radius:18px;padding:8mm;margin-top:12mm;width:92mm;box-shadow:0 6px 20px rgba(0,0,0,.08)}.qr svg{display:block;width:100%;height:auto}
.scan{font-weight:800;font-size:22px;margin-top:6mm}.place{font-size:18px;color:#4a5a4e;margin-top:3mm}
ul{list-style:none;padding:0;margin:8mm 0 0;font-size:17px;display:grid;grid-template-columns:1fr 1fr;gap:3mm 10mm;text-align:left;position:relative;z-index:1}
.sos{position:relative;z-index:1;margin-top:auto;background:#b8432c;color:#fff;border-radius:14px;padding:4mm 8mm;font-weight:800;font-size:20px}
@media print{body{background:none}.tools{display:none}.sheet{margin:0}}
</style>
</head>
<body>
<div class="tools"><select id="lg"><option value="it">Italiano</option><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option></select><input id="pl" placeholder="Nome del rifugio o della sezione" maxlength="60" style="flex:1;min-width:200px"><button onclick="print()">🖨 Stampa</button></div>
<div class="sheet">
<div class="brand"><img src="icon.svg" alt="">Wildlens</div>
<h1 id="h"></h1><p class="lead" id="l"></p>
<div class="qr" id="qr"></div>
<div class="scan" id="s"></div><div class="place" id="p"></div>
<ul id="u"></ul>
<div class="sos" id="sos"></div>
<svg class="mnt" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70L40 40 80 62 140 18 200 70 250 36 310 74 360 30 400 58V120H0Z" fill="#c9d6c3"/><path d="M0 92L60 62 110 86 170 50 230 90 290 60 340 88 400 64V120H0Z" fill="#9db394"/></svg>
</div>
<script src="app/qr.js"></script>
<script>
const URL_='https://wildlens-y5z2.onrender.com/';
const T={it:['Vai in montagna preparato','La guida che funziona senza campo: SOS con posizione, strada del ritorno, funghi e piante, Falò per il gruppo.','Inquadra con la fotocamera · gratis',['🆘 SOS con la tua posizione','🧭 Ritrova la strada','🍄 Funghi: mai senza micologo','🔥 Falò: gruppo senza internet'],'Emergenza: 112 · chiedi del Soccorso Alpino'],
en:['Go to the mountains prepared','The guide that works with no signal: SOS with your position, the way back, mushrooms and plants, Campfire for your group.','Scan with your camera · free',['🆘 SOS with your position','🧭 Find the way back','🍄 Mushrooms: always ask an expert','🔥 Campfire: your group, no internet'],'Emergency: 112 · ask for mountain rescue'],
de:['Gut vorbereitet in die Berge','Der Führer, der ohne Netz funktioniert: SOS mit Position, Rückweg, Pilze und Pflanzen, Lagerfeuer für die Gruppe.','Mit der Kamera scannen · kostenlos',['🆘 SOS mit deiner Position','🧭 Den Rückweg finden','🍄 Pilze: immer Fachleute fragen','🔥 Lagerfeuer: Gruppe ohne Internet'],'Notruf: 112 · Bergrettung verlangen'],
es:['Ve a la montaña preparado','La guía que funciona sin cobertura: SOS con tu posición, el camino de vuelta, setas y plantas, Fogata para tu grupo.','Escanea con la cámara · gratis',['🆘 SOS con tu posición','🧭 Encuentra el camino de vuelta','🍄 Setas: consulta siempre a un experto','🔥 Fogata: tu grupo sin internet'],'Emergencia: 112 · pide el rescate de montaña']};
function qr(text){const {QRCode,L}=window.QRLib;const q=new QRCode(-1,L.M);q.addData(text);q.make();const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;return`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#14201a"/></svg>`}
function draw(){const l=document.getElementById('lg').value,t=T[l],pl=document.getElementById('pl').value.trim();document.getElementById('h').textContent=t[0];document.getElementById('l').textContent=t[1];document.getElementById('s').textContent=t[2];document.getElementById('p').textContent=pl;document.getElementById('u').innerHTML=t[3].map(x=>`<li>${x}</li>`).join('');document.getElementById('sos').textContent=t[4];
document.getElementById('qr').innerHTML=qr(URL_+'?src=poster'+(pl?'&p='+encodeURIComponent(pl).slice(0,60):''))}
document.getElementById('lg').onchange=draw;document.getElementById('pl').oninput=draw;draw();
</script>
</body>
</html>
